name: Check Velox script failure handling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-failure-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the static regression checker
        run: node --test tools/tests/check-script-failures.test.mjs
      - name: Audit recommended scripts and CFG formulas
        run: node tools/check-script-failures.mjs
